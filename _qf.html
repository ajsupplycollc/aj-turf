<form class="qf" novalidate>
        <p class="qf-h">Not ready to book? Leave your number and Jereme will call or text you back.</p>
        <p class="qf-p">A turf specialist will call you within a few hours — not days. (Mon–Sat, 9–5)</p>
        <label>Name<input name="name" autocomplete="name" maxlength="80" required></label>
        <label>Phone<input name="phone" type="tel" autocomplete="tel" maxlength="30" required></label>
        <label>What do you need?<input name="need" maxlength="300" placeholder="New lawn, putting green, pet turf, a repair..."></label>
        <input name="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
        <button class="book" type="submit">Send <span aria-hidden="true">→</span></button>
        <p class="qf-c">By sending this, you agree AJ Turf may call or text you about your request. We never share your number.</p>
        <p class="qf-m" role="status" aria-live="polite"></p>
      </form>
      <script>document.querySelectorAll('.qf').forEach(f=>f.addEventListener('submit',async e=>{e.preventDefault();const m=f.querySelector('.qf-m'),b=f.querySelector('button'),d=Object.fromEntries(new FormData(f));d.page=location.pathname;if(!d.name.trim()||d.phone.replace(/\D/g,'').length<10){m.textContent='Please add your name and a 10-digit phone number.';return}b.disabled=true;m.textContent='Sending...';try{const r=await fetch('https://ajturf-chat.sam-947.workers.dev/lead',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(d)});const j=await r.json();if(!r.ok)throw new Error(j.error||'');f.reset();m.textContent="Got it — thanks. A turf specialist will reach out within a few hours during business hours (Mon–Sat, 9–5). Need us sooner? Call or text 305-762-9901.";if(window.gtag)gtag('event','generate_lead',{method:'quick_form'})}catch(err){m.textContent=(err.message||"That didn't send.")+' You can also call or text 305-762-9901.'}b.disabled=false}))</script>
